<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>自作 強震モニタ</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
    }
    #map {
      height: 100vh;
      width: 100vw;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(0,0,0,0.75);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

<div id="info">地震情報を取得中…</div>
<div id="map"></div>

<script>
  // 地図
  const map = L.map("map").setView([36.5, 138], 5);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors"
  }).addTo(map);

  // 気象庁 地震リスト
  const LIST_URL = "https://www.jma.go.jp/bosai/quake/data/list.json";

  async function loadQuake() {
    try {
      const res = await fetch(LIST_URL);
      const list = await res.json();

      // 最新の地震（1件目）
      const latest = list[0];
      const detailUrl = "https://www.jma.go.jp/bosai/quake/data/" + latest.json;

      const res2 = await fetch(detailUrl);
      const data = await res2.json();

      const time = data.earthquake.time.replace("T", " ");
      const place = data.earthquake.hypocenter.name;
      const mag = data.earthquake.hypocenter.magnitude;

      // 最大震度を探す
      let maxInt = "不明";
      if (data.intensity && data.intensity.observations) {
        let max = 0;
        data.intensity.observations.forEach(o => {
          o.intensity.forEach(i => {
            const v = Number(i.maxInt);
            if (!isNaN(v) && v > max) max = v;
          });
        });
        if (max > 0) maxInt = max;
      }

      document.getElementById("info").innerHTML =
        `🕒 ${time}<br>` +
        `📍 ${place}<br>` +
        `🌋 M${mag} / 最大震度 ${maxInt}`;

    } catch (e) {
      document.getElementById("info").textContent =
        "地震情報の取得に失敗しました";
      console.error(e);
    }
  }

  loadQuake();
  // 60秒ごとに更新
  setInterval(loadQuake, 60000);
</script>

</body>
</html>
