      <!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自作 強震モニタ</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
    }
    #map {
      height: 100vh;
      width: 100vw;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(0,0,0,0.75);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div id="info">地震情報を取得中…</div>
<div id="map"></div>

<script>
  // 地図
  const map = L.map("map").setView([36.5, 138], 5);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors"
  }).addTo(map);

  
  const LIST_URL = "https://script.google.com/macros/s/AKfycbw9cDDfLCnJ56OQtTx_Ln7_pOfzbwnS64OmJUaKHvwX-U-UKLqczvxmdPE5bxj1F4PT/exec";

  async function loadQuake() {
    try {
      const res = await fetch(LIST_URL);
      const list = await res.json();

      const latest = list[0];
      const detailUrl =
        "https://www.jma.go.jp/bosai/quake/data/" + latest.json;

      const res2 = await fetch(detailUrl);
      const data = await res2.json();

      const time = data.earthquake.time.replace("T", " ");
      const place = data.earthquake.hypocenter.name;
      const mag = data.earthquake.hypocenter.magnitude;

      let max = "不明";
      if (data.intensity?.observations) {
        let m = 0;
        data.intensity.observations.forEach(o => {
          o.intensity.forEach(i => {
            const v = Number(i.maxInt);
            if (!isNaN(v) && v > m) m = v;
          });
        });
        if (m > 0) max = m;
      }

      document.getElementById("info").innerHTML =
        `🕒 ${time}<br>` +
        `📍 ${place}<br>` +
        `🌋 M${mag} / 最大震度 ${max}`;

    } catch (e) {
      document.getElementById("info").textContent =
        "地震情報の取得に失敗しました";
      console.error(e);
    }
  }

  loadQuake();
  setInterval(loadQuake, 60000);
</script>

</body>
</html>
