<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>簡易 強震モニタ 完全版</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      background: #000;
      color: #0f0;
      font-family: monospace; /* UDフォントはあとで変更可 */
    }
    #map {
      width: 100vw;
      height: 100vh;
    }
    .info {
      position: fixed;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.7);
      border: 1px solid #0f0;
      padding: 6px 10px;
      font-size: 12px;
      z-index: 1000;
    }
  </style>
</head>
<body>

<div class="info">🟢 強震モニタ（テスト）</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ① 地図
  const map = L.map('map').setView([36.2, 138.2], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
  }).addTo(map);

  // ② 震度→色変換関数
  function shindoColor(s) {
    if (s >= 6) return 'red';
    if (s >= 5) return 'orange';
    if (s >= 4) return 'yellow';
    if (s >= 3) return 'lime';
    return 'cyan';
  }

  // ③ テスト用震度データ
  const quakes = [
    { lat: 35.6895, lng: 139.6917, shindo: 5, place: "東京" },
    { lat: 34.6937, lng: 135.5023, shindo: 4, place: "大阪" },
    { lat: 38.2682, lng: 140.8694, shindo: 3, place: "仙台" }
  ];

  // ④ 地図に表示
  quakes.forEach(q => {
    L.circle([q.lat, q.lng], {
      radius: 50000,
      color: shindoColor(q.shindo),
      fillColor: shindoColor(q.shindo),
      fillOpacity: 0.6
    }).addTo(map).bindPopup(`${q.place} 震度 ${q.shindo}`);
  });
</script>

</body>
</html>
