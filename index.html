<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>簡易 強震モニタ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      background: #000;
      color: #0f0;
      font-family: monospace; /* ← UDはあと */
    }
    #map {
      width: 100vw;
      height: 100vh;
    }
    .info {
      position: fixed;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.7);
      border: 1px solid #0f0;
      padding: 6px 10px;
      font-size: 12px;
      z-index: 1000;
    }
  </style>
</head>
<body>

<div class="info">🟢 強震モニタ（テスト）</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([36.2, 138.2], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
  }).addTo(map);

  // 🔴 テスト用 揺れ
  L.circle([35.6895, 139.6917], {
    radius: 50000,
    color: 'red',
    fillOpacity: 0.5
  }).addTo(map);
</script>

</body>
</html>
